name: CI Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Lint, Audit, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          python -m pip install --upgrade "setuptools>=83.0.0"
          python -m pip check

      - name: Static Code Analysis (Ruff)
        run: |
          # Fails if there are syntax errors, unused imports, or undefined variables
          ruff check .

      - name: Security Vulnerability Audit
        run: |
          # Scans installed packages against PyPA advisory databases
          pip-audit

      - name: Run Test Suite with Pytest
        run: |
          # Runs all unit tests with detailed output
          pytest tests/ -v --junitxml=report.xml

      - name: Streamlit App Headless Smoke Test
        run: |
          # Verify app.py can initialize in headless CI without runtime import crashes
          python -c "import src.app"